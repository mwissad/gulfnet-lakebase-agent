command: ["uv", "run", "start-server"]

env:
  - name: MLFLOW_TRACKING_URI
    value: "databricks"
  - name: MLFLOW_REGISTRY_URI
    value: "databricks-uc"
  - name: MLFLOW_EXPERIMENT_ID
    valueFrom: "experiment"
  - name: LAKEBASE_AUTOSCALING_ENDPOINT
    valueFrom: "postgres"
  - name: LAKEBASE_AUTOSCALING_PROJECT
    value: "gulfnet-agent"
  - name: LAKEBASE_AUTOSCALING_BRANCH
    value: "production"
  - name: LAKEBASE_AGENT_MEMORY_SCHEMA
    value: "gulfnet_agent_memory"
  - name: GULFNET_DATABASE
    value: "gulfnet"
  - name: ENDPOINT_NAME
    value: "projects/gulfnet-agent/branches/production/endpoints/primary"
  - name: LLM_ENDPOINT_NAME
    value: "databricks-claude-sonnet-4-5"
  - name: DATABRICKS_EMBEDDING_ENDPOINT
    value: "databricks-gte-large-en"
  - name: ENABLE_QUEUE_WORKER
    value: "1"
  - name: LOG_LEVEL
    value: "INFO"
